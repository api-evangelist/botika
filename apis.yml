aid: botika
name: Botika
description: >-
  Botika is an AI fashion-photography platform that helps online clothing and
  e-commerce brands replace traditional model photoshoots with generative AI. It
  turns flat-lay, mannequin, and basic on-model product photos into
  studio-quality images featuring fully AI-generated fashion models, poses, and
  on-brand backgrounds. Founded by Eran Dagan and Yarin Didi Meir and backed by
  an $8M seed round with participation from Seedcamp, Botika ships a web console,
  a native Shopify app, and an iOS app, cutting photoshoot costs by up to 90% and
  speeding time-to-market roughly 3x. A public API is on the company roadmap but
  is not yet released, so this profile currently captures company identity and
  public web properties rather than API artifacts.
